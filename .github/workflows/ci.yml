name: Bioconductor CI

on:
  push:
    branches: [ devel, RELEASE_* ]
  pull_request:
    branches: [ devel, RELEASE_* ]

jobs:
  bioccheck:
    # Required only if you set enable_pkgdown: true
    # permissions:
    #   pages: write
    #   id-token: write
    uses: bioconductor/workflows/.github/workflows/bioccheck.yml@main
    with:
      rcmdcheck_error_on: 'warning'
      bioccheck_error_on: 'error'
      enable_pkgdown: false
      enable_coverage_report: true
    # Required only if you want test coverage via Codecov
    # secrets:
    #   CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
